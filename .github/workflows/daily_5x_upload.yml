name: Velocity Japanese - Daily 5x Upload

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velocity-japanese-jp
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize history if not found
        run: |
          mkdir -p output/history
          if [ ! -f "output/history/all_generated_phrases.json" ]; then
            echo '{"phrases": [], "last_updated": null}' > output/history/all_generated_phrases.json
            echo "Created new phrase history file"
          else
            python -c "import json; print('History phrases:', len(json.load(open('output/history/all_generated_phrases.json'))['phrases']))"
          fi
          if [ ! -f "output/history/recent_categories.json" ]; then
            echo '{"recent_categories": [], "last_updated": null}' > output/history/recent_categories.json
            echo "Created recent categories file"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r upload/requirements.txt

      - name: Install Chromium for rendering
        run: python -m playwright install --with-deps chromium

      - name: Create .env from secrets
        env:
          AI_MODEL_SECRET: ${{ secrets.AI_MODEL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          : > .env
          echo "AI_MODEL=${AI_MODEL_SECRET:-gemini-fast}" >> .env
          for key in POLLINATIONS_API_KEY YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN \
            YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN \
            INSTAGRAM_ACCESS_TOKEN INSTAGRAM_ACCOUNT_ID IG_ACCESS_TOKEN \
            FACEBOOK_ACCESS_TOKEN FACEBOOK_PAGE_ID FB_PAGE_ACCESS_TOKEN FB_PAGE_ID META_ACCESS_TOKEN \
            THREADS_ACCESS_TOKEN THREADS_USER_ID TIKTOK_ACCESS_TOKEN TWITTER_API_KEY \
            TWITTER_API_SECRET TWITTER_ACCESS_TOKEN TWITTER_ACCESS_SECRET VK_ACCESS_TOKEN \
            VK_GROUP_ID TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID TELEGRAM_CHAT_ID CHAT_ID; do
            value="$(printenv "$key" || true)"
            echo "$key=$value" >> .env
          done
          echo ".env written ($(wc -l < .env) lines)"

      - name: Build lesson reel
        run: |
          python build.py
          echo ""
          ls -la output/lessons/*/ | tail -20

      - name: Publish to all platforms
        run: python upload_all_platforms.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velocity-japanese-jp-reel-${{ github.run_number }}
          path: |
            output/lessons/*/final_reel.mp4
            output/lessons/*/thumbnail.jpg
            output/lessons/*/metadata.json
            output/lessons/*/timeline.json
          retention-days: 7

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: |
            output/history/*.json
            output/upload_results_*.json
          retention-days: 14

      - name: Persist phrase history
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('output/history/all_generated_phrases.json') != ''
        with:
          name: phrase-history
          path: |
            output/history/all_generated_phrases.json
            output/history/recent_categories.json
          retention-days: 90
          overwrite: true

      - name: Commit phrase history
        if: always() && hashFiles('output/history/all_generated_phrases.json') != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f output/history/all_generated_phrases.json output/history/recent_categories.json
          if ! git diff --staged --quiet; then
            git commit -m "Update phrase history - Run #${{ github.run_number }}"
            git pull --rebase
            git push
            echo "History committed - no repeated phrases across runs"
          else
            echo "No history changes"
          fi
